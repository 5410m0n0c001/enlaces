<style>
:root{
  --pink:#F65C7A; --gold:#C9A96E; --dark:#1F1F1F; --bg:#F8F6F4;
  --soft:#FADADD; --beige:#EFE7E1; --gray:#6D6D6D; --card:#fff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--dark);font-family:Poppins,system-ui,sans-serif;font-size:15px}
header{padding:14px 16px 0}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 16px;border-bottom:1px solid var(--beige)}
h1{font-family:"Playfair Display",serif;font-size:21px;margin:0 0 2px}
h1 span{color:var(--pink)}
.sub{color:var(--gray);font-size:12px;margin:0 0 10px}
#q{width:100%;padding:11px 14px;border:1px solid var(--beige);border-radius:12px;font:inherit;background:#fff;outline:none}
#q:focus{border-color:var(--pink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding-top:8px}
.chip{border:1px solid var(--beige);background:#fff;border-radius:999px;padding:6px 11px;font:inherit;font-size:12.5px;line-height:1.2;color:var(--dark);cursor:pointer}
.chip.on{background:var(--pink);border-color:var(--pink);color:#fff}
main{padding:8px 16px 90px;max-width:720px;margin:0 auto}
section h2{font-family:"Playfair Display",serif;font-size:17px;margin:18px 0 8px;display:flex;align-items:center;gap:8px}
section h2::after{content:"";flex:1;height:1px;background:var(--gold);opacity:.5}
.hint{color:var(--gray);font-size:12px;margin:-4px 0 8px}
.card{background:var(--card);border:1px solid var(--beige);border-radius:14px;padding:12px;margin-bottom:10px}
.info{min-width:0}
.t{font-weight:600;font-size:14px;line-height:1.3}
.d{color:var(--gray);font-size:12px;line-height:1.35;margin-top:2px}
.u{color:var(--gold);font-size:11px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;font-size:10px;font-weight:600;background:var(--soft);color:#b8344f;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:middle}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.btns button,.btns a{min-height:44px;border-radius:12px;border:1px solid var(--beige);background:#fff;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;color:var(--dark);padding:8px;font:inherit;font-size:13px;font-weight:600;text-decoration:none}
.btns .share{grid-column:1/-1;background:var(--pink);border-color:var(--pink);color:#fff;font-size:15px}
.btns svg{width:18px;height:18px;flex:none}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--dark);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;transition:.2s;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%)}
.empty{text-align:center;color:var(--gray);padding:40px 0}
</style>
</head>

const ICON = {
  share:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>',
  copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
  open:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3"/></svg>'
};

let cat = "all";
const $ = s => document.querySelector(s);
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function renderChips(){
  $("#chips").innerHTML = [{id:"all",name:"Todo"},...DATA].map(c =>
    `<button class="chip${c.id===cat?" on":""}" data-c="${c.id}">${c.name}</button>`).join("");
}

function render(){
  const q = norm($("#q").value.trim());
  let html = "";
  DATA.forEach(c => {
    if (cat !== "all" && c.id !== cat) return;
    const items = c.links.filter(l => !q || norm(l.t+" "+l.d+" "+(l.k||"")+" "+c.name).includes(q));
    if (!items.length) return;
    html += `<section><h2>${c.name}</h2><p class="hint">${c.hint}</p>` + items.map(l => {
      const i = c.links.indexOf(l);
      return `<div class="card"><div class="info">
        <div class="t">${esc(l.t)}${l.gh?'<span class="tag">GitHub</span>':''}</div>
        <div class="d">${esc(l.d)}</div>
        <div class="u">${esc(l.u.replace(/^https?:\/\//,""))}</div></div>
        <div class="btns">
          <button class="share" data-a="share" data-c="${c.id}" data-i="${i}">${ICON.share}Compartir</button>
          <button data-a="copy" data-c="${c.id}" data-i="${i}">${ICON.copy}Copiar enlace</button>
          <a href="${l.u}" target="_blank" rel="noopener">${ICON.open}Visitar la página</a>
        </div></div>`;
    }).join("") + `</section>`;
  });
  $("#list").innerHTML = html || `<p class="empty">Sin resultados para “${esc($("#q").value)}”.</p>`;
}

function toast(m){
  const t = $("#toast"); t.textContent = m; t.classList.add("show");
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 1800);
}

async function copy(text){
  try { await navigator.clipboard.writeText(text); }
  catch { const a = document.createElement("textarea"); a.value = text; document.body.appendChild(a); a.select(); document.execCommand("copy"); a.remove(); }
  toast("Enlace copiado ✓");
}

document.addEventListener("click", async e => {
  const chip = e.target.closest(".chip");
  if (chip){ cat = chip.dataset.c; renderChips(); render(); const h = $("header").offsetHeight; if (window.scrollY > h) window.scrollTo({top:h}); return; }
  const b = e.target.closest("button[data-a]");
  if (!b) return;
  const c = DATA.find(x => x.id === b.dataset.c), l = c.links[+b.dataset.i];
  if (b.dataset.a === "copy") return copy(l.u);
  const text = `${c.msg}\n${l.t}`;
  if (navigator.share){
    try { await navigator.share({title: l.t, text, url: l.u}); } catch {}
  } else copy(`${text}\n${l.u}`);
});

$("#q").addEventListener("input", render);
renderChips(); render();
